falcosidekick:
  enabled: true
  config:
    syslog:
      host: agent-syslog
      port: 9030
falcoctl:
  artifact:
    install:
      # -- Enable the init container.
      enabled: true
    follow:
      # -- Enable the sidecar container.
      enabled: true
  config:
    artifact:
      install:
        # -- List of artifacts to be installed by the falcoctl init container.
        refs: [falco-rules:latest, k8saudit-rules:0.11, k8saudit:0.11]
      follow:
        # -- List of artifacts to be followed by the falcoctl sidecar container.
        refs: [k8saudit-rules:0.11]
services:
  - name: k8saudit-webhook
    type: NodePort
    ports:
      - port: 9765 # See plugin open_params
        nodePort: 30007
        protocol: TCP
falco:
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/k8s_audit_rules.yaml
    - /etc/falco/rules.d
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config:
        ""
        # maxEventBytes: 1048576
        # sslCertificate: /etc/falco/falco.pem
      open_params: "http://:9765/k8s-audit"
    - name: json
      library_path: libjson.so
      init_config: ""
  # Plugins that Falco will load. Note: the same plugins are installed by the falcoctl-artifact-install init container.
  load_plugins: [k8saudit, json]
customRules:
  custom-rules.yaml: |-
    - rule: Detect Unauthorized Container Registry
      desc: >
        Detect Unauthorized Container Registry
      condition: >
        kevt and 
        pod and 
        kcreate and
        not ka.req.container.image.repository startswith "docker.io/" and
        ka.target.namespace = "test"
      output: Unauthorized container image detected (image=%ka.req.container.image.repository)
      priority: WARNING
      source: k8s_audit
      tags: [k8s]