---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-quickstart
  namespace: default
spec:
  version: 8.17.3
  count: 1
  http:
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            port: 5601
            protocol: TCP
            nodePort: 30080
            targetPort: 5601
  elasticsearchRef:
    name: elasticsearch-quickstart
  config:
    xpack.fleet.agents.elasticsearch.hosts: ["https://elasticsearch-quickstart-es-http.default.svc:9200"]
    xpack.fleet.agents.fleet_server.hosts: ["https://fleet-server-quickstart-agent-http.default.svc:8220"]
    xpack.fleet.packages:
      - name: system
        version: latest
      - name: elastic_agent
        version: latest
      - name: falco
        version: latest
      - name: fleet_server
        version: latest
    xpack.fleet.agentPolicies:
      - name: Fleet Server on ECK policy
        id: eck-fleet-server
        namespace: default
        is_managed: true
        monitoring_enabled:
          - logs
          - metrics
        unenroll_timeout: 900
        package_policies:
        - name: fleet_server-1
          id: fleet_server-1
          package:
            name: fleet_server
      - name: Elastic Agent on ECK policy
        id: eck-agent
        namespace: default
        is_managed: false
        monitoring_enabled:
          - logs
          - metrics
        unenroll_timeout: 900
        package_policies:
          - name: system-1
            id: system-1
            package:
              name: system
          - name: falco-1
            id: falco-1
            package:
              name: falco
            inputs:
              - type: tcp
                enabled: true
                streams:
                  - enabled: true
                    data_stream:
                      type: logs
                      dataset: falco.alerts
                    vars:
                      - name: listen_address
                        value: "0.0.0.0"
                      - name: listen_port
                        value: 9030
                      - name: preserve_original_event
                        value: false
                      - name: preserve_falco_fields
                        value: false
              - type: logfile
                enabled: false
