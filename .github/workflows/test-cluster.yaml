---
name: Test Cluster

"on": pull_request

jobs:
  create-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.17.0
      
      - name: Add Falco Helm Repo
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.12.0
        with:
          config: kind-config.yaml

      - name: Install Elastic Operator
        run: |
          kubectl create -f https://download.elastic.co/downloads/eck/2.16.1/crds.yaml
          kubectl apply -f https://download.elastic.co/downloads/eck/2.16.1/operator.yaml

      - name: Wait for Elastic Operator
        timeout-minutes: 1
        run: |
          kubectl wait --timeout 60s -n elastic-system --for=condition=Ready pod/elastic-operator-0
      
      - name: Install Elastic Stack
        run: |
          kubectl apply -f manifests/

      - name: Wait for Elastic Stack
        timeout-minutes: 15
        run: |
          # output live deployment status
          kubectl get pods -w &
          kubectl get kibanas.kibana.k8s.elastic.co/kibana-quickstart -w &
          kubectl get elasticsearches.elasticsearch.k8s.elastic.co/elasticsearch-quickstart -w &
          kubectl get agents.agent.k8s.elastic.co/elastic-agent-quickstart -w &
          kubectl get agents.agent.k8s.elastic.co/fleet-server-quickstart -w &
          # wait for all resources to be green
          kubectl wait --timeout 1220s --for='jsonpath={.status.health}=green' kibanas.kibana.k8s.elastic.co/kibana-quickstart
          kubectl wait --timeout 1220s --for='jsonpath={.status.phase}=Ready' elasticsearches.elasticsearch.k8s.elastic.co/elasticsearch-quickstart
          kubectl wait --timeout 1220s --for='jsonpath={.status.health}=green' agents.agent.k8s.elastic.co/elastic-agent-quickstart
          kubectl wait --timeout 1220s --for='jsonpath={.status.health}=green' agents.agent.k8s.elastic.co/fleet-server-quickstart

      - name: Install Falco
        run: |
          helm install falco falcosecurity/falco \
            --set falcosidekick.enabled=true \
            --set falcosidekick.config.syslog.host=agent-syslog \
            --set falcosidekick.config.syslog.port=9030

      - name: Wait for Falco
        run: kubectl wait --for=condition=Ready pod -l 'app.kubernetes.io/instance=falco'

      - name: Wait arbitrarily
        run: sleep infinity
