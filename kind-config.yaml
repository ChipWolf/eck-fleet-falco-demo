---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
        # enable auditing flags on the API server
        extraArgs:
          audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
          audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
          audit-webhook-config-file: /etc/kubernetes/webhooks/webhook-config.yaml
          audit-webhook-batch-max-size: "10"
          audit-webhook-batch-max-wait: "5s"
        # mount new files / directories on the control plane
        extraVolumes:
          - name: audit-policies
            hostPath: /etc/kubernetes/policies
            mountPath: /etc/kubernetes/policies
            readOnly: true
            pathType: "DirectoryOrCreate"
          - name: "audit-logs"
            hostPath: "/var/log/kubernetes"
            mountPath: "/var/log/kubernetes"
            readOnly: false
            pathType: DirectoryOrCreate
          - name: webhook-config
            hostPath: /etc/kubernetes/webhooks
            mountPath: /etc/kubernetes/webhooks
            readOnly: true
            pathType: "DirectoryOrCreate"
  # mount the local file on the control plane
  extraMounts:
  - hostPath: ./audit-policy.yaml
    containerPath: /etc/kubernetes/policies/audit-policy.yaml
    readOnly: true
  - hostPath: ./webhook-config.yaml
    containerPath: /etc/kubernetes/webhooks/webhook-config.yaml
    readOnly: true
- role: worker
  extraMounts:
    - hostPath: ./data
      containerPath: /tmp/data
  extraPortMappings:
    - containerPort: 30080
      hostPort: 30080
      listenAddress: "127.0.0.1"
      protocol: tcp
    - containerPort: 30007
      hostPort: 30007
      listenAddress: "127.0.0.1"
      protocol: tcp
